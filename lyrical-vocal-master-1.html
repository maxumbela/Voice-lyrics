<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrical Vocal Master - Vanilla HTML CSS JS</title>
  <style>
    :root {
      --bg: #070814;
      --bg-2: #101225;
      --panel: rgba(255, 255, 255, 0.095);
      --panel-strong: rgba(255, 255, 255, 0.16);
      --panel-soft: rgba(255, 255, 255, 0.055);
      --text: #f8fbff;
      --muted: #aab3ca;
      --muted-2: #707b99;
      --line: rgba(255, 255, 255, 0.16);
      --primary: #8b5cf6;
      --primary-2: #06b6d4;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #fb7185;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      --radius: 28px;
      --radius-sm: 18px;
      --blur: 18px;
      --focus: 0 0 0 4px rgba(139, 92, 246, 0.28);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="light"] {
      --bg: #f3f7ff;
      --bg-2: #e7efff;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.9);
      --panel-soft: rgba(255, 255, 255, 0.5);
      --text: #111827;
      --muted: #4b5563;
      --muted-2: #6b7280;
      --line: rgba(17, 24, 39, 0.12);
      --shadow: 0 28px 80px rgba(31, 41, 55, 0.16);
      --focus: 0 0 0 4px rgba(6, 182, 212, 0.25);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 34rem),
        radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.26), transparent 30rem),
        radial-gradient(circle at 50% 100%, rgba(34, 197, 94, 0.16), transparent 26rem),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      overflow-x: hidden;
    }

    button, textarea, select, input { font: inherit; }

    button { color: inherit; }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .blob {
      position: absolute;
      width: 24rem;
      height: 24rem;
      border-radius: 999px;
      filter: blur(52px);
      opacity: 0.35;
      animation: float 13s ease-in-out infinite;
    }

    .blob.one { left: -7rem; top: 5rem; background: #8b5cf6; }
    .blob.two { right: -9rem; top: 9rem; background: #06b6d4; animation-delay: -4s; }
    .blob.three { left: 38%; bottom: -11rem; background: #22c55e; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(2rem, -1.5rem, 0) scale(1.08); }
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 950;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 16px 38px rgba(139, 92, 246, 0.35);
      color: #fff;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .pill strong { color: var(--text); }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 11px 16px;
      min-height: 42px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--text);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      text-decoration: none;
    }

    .btn:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.34); }
    .btn:active { transform: translateY(0) scale(0.99); }
    .btn:focus-visible, textarea:focus, select:focus, input:focus { outline: none; box-shadow: var(--focus); }
    .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: 0; font-weight: 800; }
    .btn.success { background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; border: 0; font-weight: 800; }
    .btn.warning { background: linear-gradient(135deg, #f97316, #f59e0b); color: #fff; border: 0; font-weight: 800; }
    .btn.danger { background: rgba(251, 113, 133, 0.14); border-color: rgba(251, 113, 133, 0.36); color: var(--danger); }
    .btn.ghost { background: transparent; }
    .btn.small { min-height: 34px; padding: 8px 11px; font-size: 0.84rem; }
    .btn.block { width: 100%; }
    .btn[disabled] { cursor: not-allowed; opacity: 0.5; transform: none; }

    main {
      margin-top: 18px;
      min-height: calc(100vh - 150px);
    }

    .view {
      animation: rise 0.45s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
      gap: 18px;
      align-items: stretch;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 28%, transparent 70%, rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }

    .card-inner { position: relative; padding: 24px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--primary-2);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 900;
      font-size: 0.72rem;
    }

    .title {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 4.9rem);
      line-height: 0.94;
      letter-spacing: -0.08em;
    }

    .title span {
      background: linear-gradient(135deg, var(--text), #c4b5fd 48%, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    html[data-theme="light"] .title span {
      background: linear-gradient(135deg, #111827, #6d28d9 48%, #0891b2);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .lead {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.75;
      margin: 18px 0 0;
      max-width: 64ch;
    }

    .input-stack { display: grid; gap: 14px; }

    label.label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    textarea, select, input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.16);
      color: var(--text);
      padding: 15px 16px;
      resize: vertical;
      min-height: 52px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    html[data-theme="light"] textarea,
    html[data-theme="light"] select,
    html[data-theme="light"] input[type="search"] {
      background: rgba(255, 255, 255, 0.82);
    }

    textarea::placeholder, input::placeholder { color: var(--muted-2); }
    textarea { min-height: 285px; line-height: 1.6; }
    select { appearance: none; cursor: pointer; }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row.between { justify-content: space-between; }
    .row.end { justify-content: flex-end; }
    .row.stretch > * { flex: 1 1 180px; }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
    }

    .feature {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-soft);
    }

    .feature b { display: block; margin-bottom: 5px; }
    .feature span { color: var(--muted); font-size: 0.88rem; line-height: 1.45; }

    .notice {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 20px;
      padding: 14px 15px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.91rem;
    }

    .notice.good { border-color: rgba(34, 197, 94, 0.35); background: rgba(34, 197, 94, 0.08); }
    .notice.bad { border-color: rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.09); color: #fecdd3; }
    html[data-theme="light"] .notice.bad { color: #be123c; }

    .checks {
      display: grid;
      gap: 10px;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 0.91rem;
      line-height: 1.45;
    }

    .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }

    .loading-wrap {
      display: grid;
      place-items: center;
      min-height: 62vh;
      text-align: center;
    }

    .loader {
      width: min(520px, 100%);
      padding: 34px;
    }

    .rings {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 0 auto 22px;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.16);
      animation: spin 3s linear infinite;
    }

    .ring:nth-child(2) { inset: 18px; border-top-color: var(--primary-2); animation-duration: 2.2s; animation-direction: reverse; }
    .ring:nth-child(3) { inset: 38px; border-left-color: var(--primary); animation-duration: 1.6s; }

    .rings .core {
      position: absolute;
      inset: 58px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      font-weight: 950;
      box-shadow: 0 14px 44px rgba(6, 182, 212, 0.3);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .map-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 16px;
    }

    .map-head h2, .section-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 3.2rem);
      letter-spacing: -0.06em;
    }

    .subtle { color: var(--muted); line-height: 1.55; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 22px;
      padding: 16px;
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }

    .stat span { color: var(--muted); font-size: 0.82rem; }
    .stat strong { display: block; margin-top: 6px; font-size: 1.45rem; letter-spacing: -0.04em; }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .level-card {
      min-height: 190px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, opacity 0.22s ease;
    }

    .level-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.33); }
    .level-card.locked { opacity: 0.52; cursor: not-allowed; filter: saturate(0.5); }
    .level-card.completed { border-color: rgba(34, 197, 94, 0.38); }
    .level-card.needs-retry { border-color: rgba(245, 158, 11, 0.42); }

    .level-no {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .level-badge {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 950;
      background: var(--panel-strong);
      border: 1px solid var(--line);
    }

    .level-preview {
      color: var(--muted);
      line-height: 1.55;
      min-height: 72px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stars { display: inline-flex; gap: 2px; letter-spacing: 0.02em; }
    .star { color: var(--muted-2); }
    .star.filled { color: var(--warning); text-shadow: 0 0 18px rgba(245, 158, 11, 0.4); }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid var(--line);
    }

    html[data-theme="light"] .progress-track { background: rgba(17, 24, 39, 0.08); }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--success));
      transition: width 0.24s ease;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    .game-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .target {
      min-height: 225px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .word-stream {
      font-size: clamp(1.65rem, 5vw, 3.8rem);
      line-height: 1.32;
      letter-spacing: -0.05em;
      font-weight: 900;
    }

    .word {
      display: inline-block;
      padding: 0.05em 0.08em;
      margin: 0.03em 0.01em;
      border-radius: 0.28em;
      color: var(--muted);
      transform-origin: center bottom;
      transition: color 0.18s ease, background 0.18s ease, transform 0.18s ease, text-shadow 0.18s ease;
    }

    .word.matched {
      color: #fff;
      background: rgba(34, 197, 94, 0.26);
      text-shadow: 0 0 26px rgba(34, 197, 94, 0.48);
      transform: translateY(-0.05em) scale(1.05);
    }

    html[data-theme="light"] .word.matched { color: #166534; }

    .word.next {
      color: var(--text);
      background: rgba(139, 92, 246, 0.15);
      outline: 1px solid rgba(139, 92, 246, 0.22);
    }

    .word.hint {
      animation: hintPulse 0.8s ease 3;
      background: rgba(245, 158, 11, 0.24);
      color: var(--warning);
    }

    @keyframes hintPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.13); }
    }

    .mic-zone {
      display: grid;
      place-items: center;
      gap: 12px;
      margin: 18px 0;
    }

    .mic-button {
      width: 118px;
      height: 118px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.38), transparent 22%), linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 22px 70px rgba(139, 92, 246, 0.38);
      transition: transform 0.2s ease, filter 0.2s ease;
      position: relative;
    }

    .mic-button:hover { transform: translateY(-2px); }
    .mic-button .mic-label { font-size: 0.95rem; font-weight: 950; letter-spacing: 0.08em; }
    .mic-button.listening { animation: micPulse 1.25s ease-in-out infinite; filter: saturate(1.2); }
    .mic-button.listening::before, .mic-button.listening::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      border: 1px solid rgba(6, 182, 212, 0.45);
      animation: ripple 1.4s ease-out infinite;
    }
    .mic-button.listening::after { animation-delay: 0.45s; }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.055); }
    }

    @keyframes ripple {
      from { transform: scale(0.96); opacity: 0.75; }
      to { transform: scale(1.36); opacity: 0; }
    }

    .speech-status { color: var(--muted); font-size: 0.92rem; min-height: 24px; text-align: center; }
    .speech-status.good { color: var(--success); }
    .speech-status.bad { color: var(--danger); }

    .side-card { padding: 18px; }

    .line-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-line {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-soft);
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .mini-line.active { color: var(--text); border-color: rgba(139, 92, 246, 0.45); background: rgba(139, 92, 246, 0.12); }
    .mini-line.done { border-color: rgba(34, 197, 94, 0.36); color: var(--success); }

    .transcript-box {
      min-height: 86px;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .score-circle {
      width: 132px;
      height: 132px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid var(--line);
      background: conic-gradient(var(--success) calc(var(--score, 0) * 1%), rgba(255, 255, 255, 0.12) 0);
      box-shadow: inset 0 0 0 12px rgba(0, 0, 0, 0.12);
    }

    .score-circle strong { font-size: 2rem; letter-spacing: -0.06em; }

    .result-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 16px;
      align-items: stretch;
    }

    .result-hero {
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 430px;
    }

    .big-stars { font-size: 2.6rem; margin: 14px 0; }

    .breakdown {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .breakdown-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: var(--panel-soft);
    }

    .toast-host {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 10px;
      z-index: 50;
      width: min(360px, calc(100vw - 36px));
    }

    .toast {
      padding: 13px 14px;
      border-radius: 18px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      color: var(--text);
      animation: toastIn 0.22s ease both;
    }

    .toast.good { border-color: rgba(34, 197, 94, 0.4); }
    .toast.bad { border-color: rgba(251, 113, 133, 0.45); }
    .toast.warn { border-color: rgba(245, 158, 11, 0.45); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 60;
      animation: fall var(--duration, 1.8s) linear forwards;
      background: hsl(var(--hue), 90%, 60%);
    }

    @keyframes fall {
      to { transform: translate3d(var(--shift, 0px), 110vh, 0) rotate(720deg); opacity: 0; }
    }

    .kbd {
      display: inline-flex;
      min-width: 24px;
      min-height: 24px;
      padding: 2px 7px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .hero, .game-layout, .result-grid { grid-template-columns: 1fr; }
      .level-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .map-head { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions, .top-stats { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 18px, 1180px); padding-top: 10px; }
      .card-inner { padding: 18px; }
      .feature-grid, .level-grid, .stat-grid { grid-template-columns: 1fr; }
      .brand { min-width: 0; }
      .topbar { top: 8px; border-radius: 20px; }
      .row.stretch > * { flex-basis: 100%; }
      .mic-button { width: 104px; height: 104px; }
      .word-stream { font-size: clamp(1.5rem, 9vw, 2.7rem); }
      textarea { min-height: 240px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">LVM</div>
        <div>
          <h1>Lyrical Vocal Master</h1>
          <p>Lyric learning game - vanilla JS</p>
        </div>
      </div>
      <div id="topStats" class="top-stats"></div>
      <div class="top-actions">
        <button class="btn small ghost" data-action="go-home" title="Setup or level map">Home</button>
        <button class="btn small ghost" data-action="toggle-theme" title="Toggle theme">Theme</button>
        <button class="btn small danger" data-action="reset-all" title="Reset everything">Reset</button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <input id="importFile" type="file" accept="application/json" hidden />
  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "lvm_vanilla_save_v1";
      var PASS_SCORE = 30;
      var AUTO_ADVANCE_SCORE = 95;
      var SpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
      var canUseClipboard = !!navigator.clipboard;
      var main = document.getElementById("view");
      var topStats = document.getElementById("topStats");
      var toastHost = document.getElementById("toastHost");

      var nonWordRegex = (function () {
        try {
          return new RegExp("[^\\p{L}\\p{M}\\p{N}]+", "gu");
        } catch (error) {
          return /[^A-Za-z0-9]+/g;
        }
      })();

      function defaultState() {
        return {
          rawText: "",
          language: "en-US",
          levels: [],
          unlocked: 0,
          xp: 0,
          completed: {},
          settings: {
            fuzzy: true,
            partial: true,
            autoAdvance: false,
            strictOrder: true,
            theme: "dark"
          },
          createdAt: new Date().toISOString()
        };
      }

      var state = defaultState();
      var view = "setup";
      var mapFilter = "";
      var session = null;
      var lastResult = null;
      var recognition = null;
      var recognitionActive = false;
      var shouldListen = false;
      var finalTranscript = "";
      var currentTranscript = "";
      var currentMatches = [];
      var hintIndex = -1;
      var autoAdvanceLock = false;
      var saveTimer = null;

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizeToken(value) {
        return String(value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .normalize("NFC")
          .replace(nonWordRegex, "")
          .trim();
      }

      function tokenizeLine(line) {
        return String(line || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .map(function (word) {
            return { text: word, norm: normalizeToken(word) };
          });
      }

      function spokenTokens(text) {
        return String(text || "")
          .trim()
          .split(/\s+/)
          .map(normalizeToken)
          .filter(Boolean);
      }

      function levenshtein(a, b) {
        if (a === b) return 0;
        if (!a) return b.length;
        if (!b) return a.length;
        var prev = [];
        var cur = [];
        var i;
        var j;
        for (j = 0; j <= b.length; j += 1) prev[j] = j;
        for (i = 1; i <= a.length; i += 1) {
          cur[0] = i;
          for (j = 1; j <= b.length; j += 1) {
            var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
            cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
          }
          var tmp = prev;
          prev = cur;
          cur = tmp;
        }
        return prev[b.length];
      }

      function tokensMatch(target, spoken, isLastSpoken) {
        if (!target || !spoken) return false;
        if (target === spoken) return true;

        if (state.settings.partial) {
          var minPartial = Math.min(3, target.length);
          if (isLastSpoken && spoken.length >= minPartial && target.indexOf(spoken) === 0) return true;
          if (target.length >= 4 && spoken.indexOf(target) === 0) return true;
          if (spoken.length >= 4 && target.indexOf(spoken) === 0) return true;
        }

        if (state.settings.fuzzy) {
          var maxLen = Math.max(target.length, spoken.length);
          if (maxLen <= 3) return false;
          var distance = levenshtein(target, spoken);
          var allowed = maxLen <= 5 ? 1 : maxLen <= 9 ? 2 : 3;
          var similarity = 1 - distance / maxLen;
          return distance <= allowed || similarity >= 0.72;
        }

        return false;
      }

      function matchTranscriptToLine(line, transcript) {
        var target = tokenizeLine(line);
        var spoken = spokenTokens(transcript);
        var matches = target.map(function () { return false; });
        var spokenPointer = 0;

        target.forEach(function (targetWord, targetIndex) {
          if (!targetWord.norm) return;

          var found = -1;
          for (var s = spokenPointer; s < spoken.length; s += 1) {
            if (tokensMatch(targetWord.norm, spoken[s], s === spoken.length - 1)) {
              found = s;
              break;
            }
            if (state.settings.strictOrder && s - spokenPointer > 8) break;
          }

          if (found >= 0) {
            matches[targetIndex] = true;
            spokenPointer = found + 1;
          }
        });

        return matches;
      }

      function scoreFromMatches(line, matches) {
        var target = tokenizeLine(line);
        var total = 0;
        var matched = 0;
        target.forEach(function (word, index) {
          if (word.norm) {
            total += 1;
            if (matches[index]) matched += 1;
          }
        });
        return {
          total: total,
          matched: matched,
          score: total ? Math.round((matched / total) * 100) : 100
        };
      }

      function getStars(score) {
        if (score >= 90) return 3;
        if (score >= 60) return 2;
        if (score >= 30) return 1;
        return 0;
      }

      function lineXP(score) {
        if (score >= 90) return 50;
        if (score >= 60) return 10;
        return 0;
      }

      function starsHTML(count) {
        var html = "";
        for (var i = 0; i < 3; i += 1) {
          html += i < count ? '<span class="star filled">&#9733;</span>' : '<span class="star">&#9734;</span>';
        }
        return '<span class="stars" aria-label="' + count + ' stars">' + html + '</span>';
      }

      function cleanInputLines(text) {
        return String(text || "")
          .split(/\r?\n/)
          .map(function (line) { return line.trim(); })
          .filter(Boolean);
      }

      function makeLevels(lines) {
        var levels = [];
        for (var i = 0; i < lines.length; i += 2) {
          levels.push({
            id: i / 2 + 1,
            lines: lines.slice(i, i + 2)
          });
        }
        return levels;
      }

      function getStats() {
        var total = state.levels.length;
        var completedValues = Object.keys(state.completed).map(function (key) { return state.completed[key]; });
        var passed = completedValues.filter(function (item) { return item.passed; }).length;
        var attempts = completedValues.reduce(function (sum, item) { return sum + (item.attempts || 0); }, 0);
        var stars = completedValues.reduce(function (sum, item) { return sum + (item.stars || 0); }, 0);
        var bestScores = completedValues.filter(function (item) { return typeof item.score === "number"; }).map(function (item) { return item.score; });
        var average = bestScores.length ? Math.round(bestScores.reduce(function (a, b) { return a + b; }, 0) / bestScores.length) : 0;
        return {
          total: total,
          passed: passed,
          attempts: attempts,
          stars: stars,
          maxStars: total * 3,
          average: average,
          percent: total ? Math.round((passed / total) * 100) : 0
        };
      }

      function renderTopStats() {
        var stats = getStats();
        topStats.innerHTML = [
          '<span class="pill"><strong>' + state.xp + '</strong> XP</span>',
          '<span class="pill"><strong>' + stats.passed + '/' + stats.total + '</strong> levels</span>',
          '<span class="pill"><strong>' + stats.stars + '/' + stats.maxStars + '</strong> stars</span>'
        ].join("");
      }

      function saveStateSoon() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 220);
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          toast("Could not save locally. Browser storage may be full.", "warn");
        }
      }

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          state = Object.assign(defaultState(), parsed);
          state.settings = Object.assign(defaultState().settings, parsed.settings || {});
          state.completed = parsed.completed || {};
          state.levels = Array.isArray(parsed.levels) ? parsed.levels : [];
        } catch (error) {
          state = defaultState();
        }
      }

      function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.settings.theme || "dark");
      }

      function toast(message, type) {
        var node = document.createElement("div");
        node.className = "toast " + (type || "");
        node.textContent = message;
        toastHost.appendChild(node);
        setTimeout(function () {
          node.style.opacity = "0";
          node.style.transform = "translateY(8px)";
          setTimeout(function () { node.remove(); }, 220);
        }, 3200);
      }

      function render() {
        renderTopStats();
        applyTheme();
        if (view === "setup") renderSetup();
        if (view === "processing") renderProcessing();
        if (view === "map") renderMap();
        if (view === "game") renderGame();
        if (view === "results") renderResults();
      }

      function browserNotice() {
        if (SpeechCtor) {
          return '<div class="notice good"><b>Microphone ready.</b> Use Chrome or Edge for the best Web Speech API support. Microphone access usually requires HTTPS or localhost.</div>';
        }
        return '<div class="notice bad"><b>Speech recognition is not available in this browser.</b> You can still play with manual transcript mode, or open the file in Chrome/Edge for live microphone sync.</div>';
      }

      function languageOptions() {
        var languages = [
          ["en-US", "English - US"],
          ["en-GB", "English - UK"],
          ["bn-BD", "Bengali / Bangla - Bangladesh"],
          ["hi-IN", "Hindi - India"],
          ["es-ES", "Spanish - Spain"],
          ["es-MX", "Spanish - Mexico"],
          ["fr-FR", "French - France"],
          ["de-DE", "German - Germany"],
          ["it-IT", "Italian - Italy"],
          ["pt-BR", "Portuguese - Brazil"],
          ["ar-SA", "Arabic - Saudi Arabia"],
          ["ja-JP", "Japanese - Japan"],
          ["ko-KR", "Korean - Korea"]
        ];
        return languages.map(function (item) {
          return '<option value="' + item[0] + '"' + (state.language === item[0] ? " selected" : "") + '>' + item[1] + '</option>';
        }).join("");
      }

      function settingsHTML() {
        return [
          '<label class="check"><input type="checkbox" data-setting="fuzzy" ' + (state.settings.fuzzy ? "checked" : "") + ' /> <span><b>Fuzzy matching</b><br>Accepts small mistakes such as lovin/loving.</span></label>',
          '<label class="check"><input type="checkbox" data-setting="partial" ' + (state.settings.partial ? "checked" : "") + ' /> <span><b>Partial live sync</b><br>Highlights words while you are still saying them.</span></label>',
          '<label class="check"><input type="checkbox" data-setting="strictOrder" ' + (state.settings.strictOrder ? "checked" : "") + ' /> <span><b>Strict order</b><br>Best for memorization because words must be spoken in sequence.</span></label>',
          '<label class="check"><input type="checkbox" data-setting="autoAdvance" ' + (state.settings.autoAdvance ? "checked" : "") + ' /> <span><b>Auto advance at 95%</b><br>Automatically checks the line when it sounds complete.</span></label>'
        ].join("");
      }

      function renderSetup() {
        var lineCount = cleanInputLines(state.rawText).length;
        var estimatedLevels = Math.ceil(lineCount / 2);
        main.innerHTML = '<section class="view hero">' +
          '<div class="card"><div class="card-inner">' +
            '<p class="eyebrow">Practice lyrics, poems, scripts, speeches</p>' +
            '<h2 class="title">Memorize lines with <span>real-time voice sync.</span></h2>' +
            '<p class="lead">Paste your text, generate two-line levels, speak each line, watch words turn green, earn XP, collect stars, and unlock the next level.</p>' +
            '<div class="feature-grid">' +
              '<div class="feature"><b>2-line levels</b><span>Long text is automatically chunked into focused practice levels.</span></div>' +
              '<div class="feature"><b>Instant scoring</b><span>Accuracy is calculated from matched words and saved locally.</span></div>' +
              '<div class="feature"><b>Advanced matching</b><span>Case-insensitive cleanup, partial matching, and Levenshtein fuzzy logic.</span></div>' +
              '<div class="feature"><b>Progress tools</b><span>Autosave, import/export JSON, retry mode, hints, and text-to-speech preview.</span></div>' +
            '</div>' +
          '</div></div>' +
          '<div class="card"><div class="card-inner input-stack">' +
            '<div>' +
              '<label class="label" for="rawText">Paste lyrics, poem, script, or speech</label>' +
              '<textarea id="rawText" placeholder="Example:\nI found a love for me\nDarling just dive right in\nAnd follow my lead">' + escapeHTML(state.rawText) + '</textarea>' +
              '<div class="row between" style="margin-top:8px;"><span class="subtle" id="textMeta">' + lineCount + ' usable lines - ' + estimatedLevels + ' levels</span><button class="btn small ghost" data-action="load-demo">Load demo</button></div>' +
            '</div>' +
            '<div class="row stretch">' +
              '<div><label class="label" for="languageSelect">Dictation language</label><select id="languageSelect">' + languageOptions() + '</select></div>' +
              '<div><label class="label">Save tools</label><div class="row"><button class="btn small" data-action="export-save">Export</button><button class="btn small" data-action="import-save">Import</button></div></div>' +
            '</div>' +
            browserNotice() +
            '<div class="checks">' + settingsHTML() + '</div>' +
            '<button class="btn primary block" data-action="generate">Generate Level Game</button>' +
          '</div></div>' +
        '</section>';
      }

      function renderProcessing() {
        var lines = cleanInputLines(state.rawText).length;
        var levels = Math.ceil(lines / 2);
        main.innerHTML = '<section class="view loading-wrap">' +
          '<div class="card loader"><div class="card-inner">' +
            '<div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core">AI</div></div>' +
            '<h2 class="section-title">Building your vocal quest</h2>' +
            '<p class="subtle">Cleaning empty lines, creating ' + levels + ' two-line levels, preparing word sync, and saving your course locally.</p>' +
            '<div class="progress-track" style="margin-top:18px;"><div class="progress-fill" style="width:82%;"></div></div>' +
          '</div></div>' +
        '</section>';
      }

      function renderMap() {
        if (!state.levels.length) {
          view = "setup";
          renderSetup();
          return;
        }

        var stats = getStats();
        var query = mapFilter.trim().toLowerCase();
        var cards = state.levels.map(function (level, index) {
          var completed = state.completed[index];
          var unlocked = index <= state.unlocked || (completed && completed.passed);
          var passed = completed && completed.passed;
          var attempted = completed && completed.attempts;
          var preview = level.lines.join(" / ");
          if (query && preview.toLowerCase().indexOf(query) === -1 && String(index + 1).indexOf(query) === -1) return "";
          var cls = "level-card card";
          if (!unlocked) cls += " locked";
          if (passed) cls += " completed";
          if (attempted && !passed) cls += " needs-retry";
          var label = !unlocked ? "Locked" : passed ? "Completed" : attempted ? "Retry" : "Unlocked";
          var scoreLabel = attempted ? (completed.score || 0) + "% best" : "Not played";
          var stars = attempted ? starsHTML(completed.stars || 0) : starsHTML(0);
          return '<article class="' + cls + '" data-action="open-level" data-level="' + index + '" tabindex="0" role="button" aria-label="Open level ' + (index + 1) + '">' +
            '<div class="level-no"><div class="level-badge">' + (index + 1) + '</div><span class="pill">' + label + '</span></div>' +
            '<div class="level-preview">' + escapeHTML(preview) + '</div>' +
            '<div class="row between" style="margin-top:14px;"><span>' + stars + '</span><span class="subtle">' + scoreLabel + '</span></div>' +
          '</article>';
        }).join("");

        main.innerHTML = '<section class="view">' +
          '<div class="map-head">' +
            '<div><p class="eyebrow">Level map</p><h2>Unlock the full performance.</h2><p class="subtle">Pass each level with at least 30% accuracy to unlock the next one. Replay completed levels to improve stars and XP.</p></div>' +
            '<div class="row end"><button class="btn" data-action="new-text">New text</button><button class="btn" data-action="export-save">Export save</button></div>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat"><span>Total XP</span><strong>' + state.xp + '</strong></div>' +
            '<div class="stat"><span>Progress</span><strong>' + stats.percent + '%</strong></div>' +
            '<div class="stat"><span>Stars</span><strong>' + stats.stars + '/' + stats.maxStars + '</strong></div>' +
            '<div class="stat"><span>Average best</span><strong>' + stats.average + '%</strong></div>' +
          '</div>' +
          '<div class="card"><div class="card-inner">' +
            '<div class="row between">' +
              '<div style="min-width:220px; flex:1;"><label class="label" for="levelSearch">Search level text</label><input id="levelSearch" type="search" placeholder="Search by lyric or level number" value="' + escapeHTML(mapFilter) + '" /></div>' +
              '<div class="notice" style="flex:1; min-width:260px;">Keyboard: <span class="kbd">Space</span> mic, <span class="kbd">Enter</span> check, <span class="kbd">H</span> hint during gameplay.</div>' +
            '</div>' +
            '<div class="level-grid">' + (cards || '<div class="empty">No level matched your search.</div>') + '</div>' +
          '</div></div>' +
        '</section>';
      }

      function currentLevel() {
        return session ? state.levels[session.levelIndex] : null;
      }

      function currentLine() {
        var level = currentLevel();
        if (!level) return "";
        return level.lines[session.lineIndex] || "";
      }

      function prepareLine() {
        finalTranscript = "";
        currentTranscript = "";
        currentMatches = tokenizeLine(currentLine()).map(function () { return false; });
        hintIndex = -1;
        autoAdvanceLock = false;
      }

      function renderWords() {
        var stream = document.getElementById("wordStream");
        if (!stream || !session) return;
        var tokens = tokenizeLine(currentLine());
        var firstMissing = -1;
        tokens.forEach(function (word, index) {
          if (firstMissing === -1 && word.norm && !currentMatches[index]) firstMissing = index;
        });
        stream.innerHTML = tokens.map(function (word, index) {
          var cls = "word";
          if (word.norm && currentMatches[index]) cls += " matched";
          if (index === firstMissing) cls += " next";
          if (index === hintIndex) cls += " hint";
          return '<span class="' + cls + '">' + escapeHTML(word.text) + '</span>';
        }).join(" ");

        var scored = scoreFromMatches(currentLine(), currentMatches);
        var liveScore = document.getElementById("liveScore");
        var liveWords = document.getElementById("liveWords");
        var bar = document.getElementById("liveProgressBar");
        if (liveScore) liveScore.textContent = scored.score + "%";
        if (liveWords) liveWords.textContent = scored.matched + "/" + scored.total + " words matched";
        if (bar) bar.style.width = scored.score + "%";
      }

      function renderTranscriptBox() {
        var transcript = document.getElementById("manualTranscript");
        if (transcript && document.activeElement !== transcript) transcript.value = currentTranscript;
      }

      function updateMatches() {
        currentMatches = matchTranscriptToLine(currentLine(), currentTranscript);
        renderWords();
        renderTranscriptBox();
        var scored = scoreFromMatches(currentLine(), currentMatches);
        if (state.settings.autoAdvance && scored.score >= AUTO_ADVANCE_SCORE && currentTranscript.trim() && !autoAdvanceLock) {
          autoAdvanceLock = true;
          setTimeout(function () {
            if (view === "game" && session) checkAndNext();
          }, 650);
        }
      }

      function renderGame() {
        if (!session) {
          view = "map";
          renderMap();
          return;
        }
        var level = currentLevel();
        var line = currentLine();
        var scored = scoreFromMatches(line, currentMatches);
        var supportText = SpeechCtor ? "Ready" : "Manual mode only";
        var supportClass = SpeechCtor ? "good" : "bad";

        main.innerHTML = '<section class="view game-layout">' +
          '<div class="card"><div class="card-inner">' +
            '<div class="game-head">' +
              '<div><p class="eyebrow">Level ' + (session.levelIndex + 1) + '</p><h2 class="section-title">Line ' + (session.lineIndex + 1) + ' of ' + level.lines.length + '</h2><p class="subtle">Speak the target line. Matched words glow green in real time.</p></div>' +
              '<div class="row"><button class="btn small" data-action="back-map">Map</button><button class="btn small" data-action="retry-line">Retry line</button></div>' +
            '</div>' +
            '<div class="target">' +
              '<div id="wordStream" class="word-stream"></div>' +
              '<div>' +
                '<div class="row between"><span class="pill"><strong id="liveScore">' + scored.score + '%</strong> live accuracy</span><span class="pill" id="liveWords">' + scored.matched + '/' + scored.total + ' words matched</span></div>' +
                '<div class="progress-track" style="margin-top:10px;"><div id="liveProgressBar" class="progress-fill" style="width:' + scored.score + '%;"></div></div>' +
              '</div>' +
            '</div>' +
            '<div class="mic-zone">' +
              '<button class="mic-button' + (recognitionActive ? ' listening' : '') + '" data-action="toggle-mic" aria-label="Toggle microphone"><span class="mic-label">' + (recognitionActive ? 'STOP' : 'MIC') + '</span></button>' +
              '<div id="speechStatus" class="speech-status ' + supportClass + '">' + supportText + '</div>' +
            '</div>' +
            '<div class="row stretch">' +
              '<button class="btn" data-action="listen-line">Listen preview</button>' +
              '<button class="btn" data-action="hint-word">Hint next word</button>' +
              '<button class="btn" data-action="copy-line">Copy target</button>' +
              '<button class="btn primary" data-action="check-next">Check & Next</button>' +
            '</div>' +
            '<label class="label" for="manualTranscript" style="margin-top:16px;">Transcript / manual fallback</label>' +
            '<textarea id="manualTranscript" class="transcript-box" placeholder="Live speech appears here. Unsupported browser? Type your spoken line here and press Check & Next.">' + escapeHTML(currentTranscript) + '</textarea>' +
          '</div></div>' +
          '<aside class="card"><div class="card-inner side-card">' +
            '<p class="eyebrow">Session</p>' +
            '<h3 style="margin:0; font-size:1.35rem; letter-spacing:-0.04em;">Two-line chunk</h3>' +
            '<div class="line-list">' + level.lines.map(function (text, index) {
              var cls = "mini-line";
              if (index === session.lineIndex) cls += " active";
              if (typeof session.lineScores[index] === "number") cls += " done";
              var suffix = typeof session.lineScores[index] === "number" ? '<br><b>' + session.lineScores[index] + '% saved</b>' : '';
              return '<div class="' + cls + '">' + escapeHTML(text) + suffix + '</div>';
            }).join("") + '</div>' +
            '<div class="notice" style="margin-top:14px;">A score of 30% unlocks the next level. 90% gives 3 stars and +50 XP per line. 60% gives +10 XP per line.</div>' +
            '<div class="checks" style="margin-top:14px;">' + settingsHTML() + '</div>' +
          '</div></aside>' +
        '</section>';
        renderWords();
        setSpeechStatus(recognitionActive ? "Listening..." : supportText, supportClass);
      }

      function renderResults() {
        if (!lastResult) {
          view = "map";
          renderMap();
          return;
        }
        var result = lastResult;
        var level = state.levels[result.levelIndex];
        var nextUnlocked = result.passed && result.levelIndex < state.levels.length - 1;
        var title = result.passed ? "Level cleared" : "Keep practicing";
        var message = result.passed ? (nextUnlocked ? "The next level is now unlocked." : "You cleared the final level.") : "Reach at least 30% accuracy to unlock the next level.";
        var breakdown = level.lines.map(function (line, index) {
          var score = result.lineScores[index] || 0;
          var transcript = result.transcripts[index] || "";
          return '<div class="breakdown-item">' +
            '<div class="row between"><b>Line ' + (index + 1) + '</b><span class="pill"><strong>' + score + '%</strong> ' + lineXP(score) + ' XP</span></div>' +
            '<p class="subtle" style="margin:10px 0 6px;">Target: ' + escapeHTML(line) + '</p>' +
            '<p class="subtle" style="margin:0;">Transcript: ' + escapeHTML(transcript || "No transcript") + '</p>' +
          '</div>';
        }).join("");

        main.innerHTML = '<section class="view result-grid">' +
          '<div class="card result-hero"><div class="card-inner">' +
            '<p class="eyebrow">Results</p>' +
            '<div class="score-circle" style="--score:' + result.average + '"><strong>' + result.average + '%</strong></div>' +
            '<h2 class="section-title">' + title + '</h2>' +
            '<div class="big-stars">' + starsHTML(result.stars) + '</div>' +
            '<p class="subtle">' + message + '</p>' +
            '<div class="row" style="justify-content:center; margin-top:18px;"><span class="pill"><strong>+' + result.xpEarned + '</strong> XP earned</span><span class="pill"><strong>' + result.attempts + '</strong> attempts</span></div>' +
            '<div class="row" style="justify-content:center; margin-top:18px;"><button class="btn primary" data-action="back-map">Return to Map</button><button class="btn" data-action="retry-level">Retry Level</button><button class="btn success" data-action="next-level" ' + (!nextUnlocked ? 'disabled' : '') + '>Next Level</button></div>' +
          '</div></div>' +
          '<div class="card"><div class="card-inner">' +
            '<p class="eyebrow">Line-by-line evaluation</p>' +
            '<h2 class="section-title">Accuracy breakdown</h2>' +
            '<div class="breakdown">' + breakdown + '</div>' +
          '</div></div>' +
        '</section>';
      }

      function setSpeechStatus(message, type) {
        var node = document.getElementById("speechStatus");
        if (!node) return;
        node.textContent = message;
        node.className = "speech-status " + (type || "");
      }

      function setMicUi(active) {
        var button = document.querySelector(".mic-button");
        if (!button) return;
        button.classList.toggle("listening", active);
        var label = button.querySelector(".mic-label");
        if (label) label.textContent = active ? "STOP" : "MIC";
      }

      function buildRecognition() {
        if (!SpeechCtor) return null;
        var rec = new SpeechCtor();
        rec.lang = state.language;
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 1;

        rec.onstart = function () {
          recognitionActive = true;
          setMicUi(true);
          setSpeechStatus("Listening... speak the target line", "good");
        };

        rec.onresult = function (event) {
          var interim = "";
          for (var i = event.resultIndex; i < event.results.length; i += 1) {
            var text = event.results[i][0].transcript || "";
            if (event.results[i].isFinal) {
              finalTranscript += " " + text.trim();
            } else {
              interim += " " + text.trim();
            }
          }
          currentTranscript = (finalTranscript + " " + interim).replace(/\s+/g, " ").trim();
          updateMatches();
        };

        rec.onerror = function (event) {
          var error = event.error || "unknown";
          var friendly = "Speech error: " + error;
          if (error === "not-allowed" || error === "service-not-allowed") {
            friendly = "Microphone permission denied. You can use manual transcript mode.";
            shouldListen = false;
          }
          if (error === "no-speech") friendly = "No speech detected. Try again or move closer to the microphone.";
          setSpeechStatus(friendly, "bad");
          toast(friendly, "bad");
        };

        rec.onend = function () {
          recognitionActive = false;
          setMicUi(false);
          if (shouldListen) {
            setTimeout(function () {
              if (!shouldListen || recognitionActive) return;
              try {
                rec.start();
              } catch (error) {
                recognitionActive = false;
              }
            }, 260);
          } else {
            setSpeechStatus("Stopped", "");
          }
        };

        return rec;
      }

      function startListening() {
        if (!SpeechCtor) {
          toast("This browser does not support live speech recognition. Use manual transcript mode or Chrome/Edge.", "warn");
          setSpeechStatus("Manual mode only", "bad");
          return;
        }
        if (!session) return;
        window.speechSynthesis && window.speechSynthesis.cancel();
        if (!recognition || recognition.lang !== state.language) recognition = buildRecognition();
        shouldListen = true;
        if (recognitionActive) return;
        try {
          recognition.start();
        } catch (error) {
          setSpeechStatus("Already listening", "good");
        }
      }

      function stopListening() {
        shouldListen = false;
        if (recognition && recognitionActive) {
          try { recognition.stop(); } catch (error) { /* ignore */ }
        }
        recognitionActive = false;
        setMicUi(false);
        setSpeechStatus("Stopped", "");
      }

      function toggleMic() {
        if (recognitionActive || shouldListen) stopListening();
        else startListening();
      }

      function generateGame() {
        var textarea = document.getElementById("rawText");
        var language = document.getElementById("languageSelect");
        if (textarea) state.rawText = textarea.value;
        if (language) state.language = language.value;
        var lines = cleanInputLines(state.rawText);
        if (!lines.length) {
          toast("Paste at least one non-empty line first.", "warn");
          return;
        }
        if (lines.length > 500) {
          toast("Large text detected. For best performance, try 500 lines or fewer.", "warn");
        }
        view = "processing";
        render();
        setTimeout(function () {
          state.levels = makeLevels(lines);
          state.unlocked = 0;
          state.completed = {};
          state.createdAt = new Date().toISOString();
          mapFilter = "";
          saveState();
          view = "map";
          render();
          toast("Created " + state.levels.length + " levels.", "good");
        }, 900);
      }

      function openLevel(index) {
        index = Number(index);
        var completed = state.completed[index];
        var unlocked = index <= state.unlocked || (completed && completed.passed);
        if (!unlocked) {
          toast("This level is locked. Clear the previous level first.", "warn");
          return;
        }
        stopListening();
        session = {
          levelIndex: index,
          lineIndex: 0,
          lineScores: [],
          transcripts: [],
          startedAt: Date.now()
        };
        prepareLine();
        view = "game";
        render();
      }

      function retryLine() {
        if (!session) return;
        stopListening();
        prepareLine();
        renderGame();
        toast("Line reset.", "good");
      }

      function checkAndNext() {
        if (!session) return;
        stopListening();
        var line = currentLine();
        currentMatches = matchTranscriptToLine(line, currentTranscript);
        var scored = scoreFromMatches(line, currentMatches);
        session.lineScores[session.lineIndex] = scored.score;
        session.transcripts[session.lineIndex] = currentTranscript;

        var level = currentLevel();
        if (session.lineIndex < level.lines.length - 1) {
          session.lineIndex += 1;
          prepareLine();
          renderGame();
          toast("Line saved: " + scored.score + "%. Next line ready.", "good");
          return;
        }

        finishLevel();
      }

      function finishLevel() {
        var levelIndex = session.levelIndex;
        var level = currentLevel();
        var totalScore = 0;
        for (var i = 0; i < level.lines.length; i += 1) {
          totalScore += typeof session.lineScores[i] === "number" ? session.lineScores[i] : 0;
        }
        var average = Math.round(totalScore / level.lines.length);
        var stars = getStars(average);
        var passed = average >= PASS_SCORE;
        var xpEarned = session.lineScores.reduce(function (sum, score) { return sum + lineXP(score || 0); }, 0);
        state.xp += xpEarned;

        var previous = state.completed[levelIndex] || { attempts: 0, score: 0, stars: 0, passed: false };
        var bestScore = Math.max(previous.score || 0, average);
        var bestStars = Math.max(previous.stars || 0, stars);
        state.completed[levelIndex] = {
          score: bestScore,
          stars: bestStars,
          passed: Boolean(previous.passed || passed),
          attempts: (previous.attempts || 0) + 1,
          lastScore: average,
          lastStars: stars,
          lastLineScores: session.lineScores.slice(),
          lastXp: xpEarned,
          lastPlayed: new Date().toISOString()
        };

        if (passed && levelIndex >= state.unlocked && levelIndex < state.levels.length - 1) {
          state.unlocked = levelIndex + 1;
        }

        lastResult = {
          levelIndex: levelIndex,
          average: average,
          stars: stars,
          passed: passed,
          xpEarned: xpEarned,
          attempts: state.completed[levelIndex].attempts,
          lineScores: session.lineScores.slice(),
          transcripts: session.transcripts.slice()
        };

        session = null;
        saveState();
        view = "results";
        renderResults();
        renderTopStats();
        if (passed) burstConfetti();
      }

      function hintNextWord() {
        if (!session) return;
        var tokens = tokenizeLine(currentLine());
        var found = -1;
        for (var i = 0; i < tokens.length; i += 1) {
          if (tokens[i].norm && !currentMatches[i]) {
            found = i;
            break;
          }
        }
        if (found === -1) {
          toast("Every word is already matched.", "good");
          return;
        }
        hintIndex = found;
        renderWords();
        toast("Next word: " + tokens[found].text, "warn");
      }

      function listenLine() {
        if (!session) return;
        if (!window.speechSynthesis) {
          toast("Text-to-speech is not available in this browser.", "warn");
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(currentLine());
        utterance.lang = state.language;
        utterance.rate = 0.9;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
      }

      function copyLine() {
        if (!session) return;
        if (!canUseClipboard) {
          toast("Clipboard is not available in this browser.", "warn");
          return;
        }
        navigator.clipboard.writeText(currentLine()).then(function () {
          toast("Target line copied.", "good");
        }).catch(function () {
          toast("Could not copy the line.", "warn");
        });
      }

      function loadDemo() {
        state.rawText = [
          "Every sunrise writes a promise in the sky",
          "I breathe it in and let my doubts fly",
          "Step by step I find the rhythm of my heart",
          "Word by word I turn the silence into art",
          "When the night is loud I still remember light",
          "I sing the truth until the fear takes flight"
        ].join("\n");
        saveStateSoon();
        renderSetup();
        toast("Demo text loaded.", "good");
      }

      function updateTextMeta() {
        var textarea = document.getElementById("rawText");
        var meta = document.getElementById("textMeta");
        if (!textarea || !meta) return;
        var lines = cleanInputLines(textarea.value).length;
        meta.textContent = lines + " usable lines - " + Math.ceil(lines / 2) + " levels";
      }

      function exportSave() {
        var data = JSON.stringify(state, null, 2);
        var blob = new Blob([data], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "lyrical-vocal-master-save.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        toast("Save exported as JSON.", "good");
      }

      function importSave() {
        document.getElementById("importFile").click();
      }

      function handleImport(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result || ""));
            if (!parsed || !Array.isArray(parsed.levels) || typeof parsed.xp !== "number") {
              throw new Error("Invalid save format");
            }
            state = Object.assign(defaultState(), parsed);
            state.settings = Object.assign(defaultState().settings, parsed.settings || {});
            state.completed = parsed.completed || {};
            applyTheme();
            saveState();
            view = state.levels.length ? "map" : "setup";
            render();
            toast("Save imported.", "good");
          } catch (error) {
            toast("Invalid save file.", "bad");
          }
        };
        reader.readAsText(file);
      }

      function newText() {
        stopListening();
        view = "setup";
        render();
      }

      function resetAll() {
        var ok = window.confirm("Reset all text, levels, progress, XP, and local save?");
        if (!ok) return;
        stopListening();
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        session = null;
        lastResult = null;
        mapFilter = "";
        view = "setup";
        render();
        toast("Everything has been reset.", "good");
      }

      function burstConfetti() {
        var count = 60;
        for (var i = 0; i < count; i += 1) {
          var piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.random() * 100 + "vw";
          piece.style.setProperty("--hue", String(Math.floor(Math.random() * 360)));
          piece.style.setProperty("--shift", (Math.random() * 220 - 110) + "px");
          piece.style.setProperty("--duration", (1.3 + Math.random() * 1.7) + "s");
          document.body.appendChild(piece);
          setTimeout(function (node) { node.remove(); }, 3200, piece);
        }
      }

      document.addEventListener("click", function (event) {
        var trigger = event.target.closest("[data-action]");
        if (!trigger) return;
        var action = trigger.getAttribute("data-action");
        var level = trigger.getAttribute("data-level");

        if (action === "generate") generateGame();
        if (action === "load-demo") loadDemo();
        if (action === "open-level") openLevel(level);
        if (action === "back-map") { stopListening(); view = "map"; render(); }
        if (action === "toggle-mic") toggleMic();
        if (action === "check-next") checkAndNext();
        if (action === "retry-line") retryLine();
        if (action === "listen-line") listenLine();
        if (action === "hint-word") hintNextWord();
        if (action === "copy-line") copyLine();
        if (action === "retry-level" && lastResult) openLevel(lastResult.levelIndex);
        if (action === "next-level" && lastResult) openLevel(lastResult.levelIndex + 1);
        if (action === "new-text") newText();
        if (action === "go-home") { stopListening(); view = state.levels.length ? "map" : "setup"; render(); }
        if (action === "toggle-theme") { state.settings.theme = state.settings.theme === "light" ? "dark" : "light"; applyTheme(); saveState(); renderTopStats(); toast("Theme changed.", "good"); }
        if (action === "reset-all") resetAll();
        if (action === "export-save") exportSave();
        if (action === "import-save") importSave();
      });

      document.addEventListener("keydown", function (event) {
        var tag = document.activeElement ? document.activeElement.tagName : "";
        var typing = tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT";
        if (typing || view !== "game") return;
        if (event.code === "Space") {
          event.preventDefault();
          toggleMic();
        }
        if (event.code === "Enter") {
          event.preventDefault();
          checkAndNext();
        }
        if (event.key.toLowerCase() === "h") {
          event.preventDefault();
          hintNextWord();
        }
      });

      document.addEventListener("input", function (event) {
        if (event.target.id === "rawText") {
          state.rawText = event.target.value;
          updateTextMeta();
          saveStateSoon();
        }
        if (event.target.id === "manualTranscript") {
          finalTranscript = event.target.value;
          currentTranscript = finalTranscript;
          updateMatches();
        }
        if (event.target.id === "levelSearch") {
          mapFilter = event.target.value;
          renderMap();
          var search = document.getElementById("levelSearch");
          if (search) {
            search.focus();
            search.setSelectionRange(search.value.length, search.value.length);
          }
        }
      });

      document.addEventListener("change", function (event) {
        if (event.target.id === "languageSelect") {
          state.language = event.target.value;
          saveStateSoon();
        }
        if (event.target.id === "importFile") {
          handleImport(event.target.files[0]);
          event.target.value = "";
        }
        if (event.target.matches("[data-setting]")) {
          var key = event.target.getAttribute("data-setting");
          state.settings[key] = event.target.checked;
          saveStateSoon();
          if (view === "game") updateMatches();
        }
      });

      document.addEventListener("keyup", function (event) {
        if (event.target && event.target.classList && event.target.classList.contains("level-card")) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openLevel(event.target.getAttribute("data-level"));
          }
        }
      });

      window.addEventListener("beforeunload", function () {
        stopListening();
        saveState();
      });

      loadState();
      applyTheme();
      view = state.levels.length ? "map" : "setup";
      render();
    })();
  </script>
</body>
</html>
